[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "2.0.0"
description = "AI-powered DevOps CLI tool — generates production-grade infrastructure from any codebase (NVIDIA-only)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.5",
    "tenacity>=8.0.0",
    "urllib3>=2.7.0",
    "cryptography>=48.0.1",
    "openai>=1.30.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
devops-agent = "main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "tests/",
    "sample-node-app/",
    "scripts/",
]