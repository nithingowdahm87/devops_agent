[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "2.0.0"
description = "AI-powered DevOps CLI tool — generates production-grade infrastructure from any codebase (NVIDIA-only)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langgraph",
    "requests",
    "pyyaml",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "chromadb>=0.4.0",
    "tenacity>=8.0.0",
    "langchain-core>=1.2.22",
    "langsmith>=0.8.18",
    "urllib3>=2.7.0",
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
devops-agent = "main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"