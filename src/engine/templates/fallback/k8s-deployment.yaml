apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-fallback
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fallback
  template:
    metadata:
      labels:
        app: fallback
    spec:
      containers:
      - name: app
        image: app:latest
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: app-fallback
spec:
  selector:
    app: fallback
  ports:
  - port: 80
    targetPort: 3000
