
FILENAME: k8s/namespace.yaml
```yaml
apiVersion: v1
kind: Namespace
metadata:
  name: sample-api
  labels:
    name: sample-api
    cost.allocation: sample-api
```

FILENAME: k8s/configmap.yaml
```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sample-api
data:
  PORT: "3000"
  NODE_ENV: production
```

FILENAME: k8s/secret.yaml
```yaml
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: sample-api
type: Opaque
stringData:
  # PLACEHOLDER — Replace with Sealed Secrets, Vault, or external-secrets in production.
  MONGODB_URI: mongodb://mongo:27017/sampledb
  JWT_SECRET: change-me-in-production
```

FILENAME: k8s/deployment.yaml
```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {service_name}
  namespace: sample-api
  labels:
    app: {service_name}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {service_name}
  template:
    metadata:
      labels:
        app: {service_name}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{port}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {service_name}
      containers:
        - name: {service_name}
          image: "ghcr.io/OWNER/REPO:v1.0.0"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: {port}
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: "{port}"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: "{port}"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {service_name}
                topologyKey: kubernetes.io/hostname
```

FILENAME: k8s/service.yaml
```yaml
apiVersion: v1
kind: Service
metadata:
  name: {service_name}
  namespace: sample-api
spec:
  type: ClusterIP
  selector:
    app: {service_name}
  ports:
    - port: 80
      targetPort: "{port}"
      protocol: TCP
      name: http
```

FILENAME: k8s/ingress.yaml
```yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {service_name}
  namespace: sample-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {service_name}
                port:
                  number: 80
```

FILENAME: k8s/hpa.yaml
```yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {service_name}
  namespace: sample-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {service_name}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
```

FILENAME: k8s/pdb.yaml
```yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {service_name}
  namespace: sample-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {service_name}
```

FILENAME: k8s/networkpolicy.yaml
```yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {service_name}-network-policy
  namespace: sample-api
spec:
  podSelector:
    matchLabels:
      app: {service_name}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: "{port}"
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
```

