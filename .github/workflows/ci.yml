name: DevOps Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - run: uv pip install -e ".[test]"
      - run: pytest tests/test_api_*.py -v
      - run: |
          python main.py --mode server --port 8000 &
          sleep 5
          python scripts/http_client_tests.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -t devops-agent:latest .
      - run: docker images | grep devops-agent

  security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -t devops-agent:latest .

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-agent:latest
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - run: uv pip install -e ".[test]"
      - run: |
          python main.py --mode server --port 8000 &
          sleep 5
          python scripts/http_client_tests.py