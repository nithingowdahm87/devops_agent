name: DevOps Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - run: uv pip install -e ".[test]"
      - run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -t devops-agent:latest .
      - run: docker images | grep devops-agent

  security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -t devops-agent:latest .

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-agent:latest
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - run: uv pip install -e ".[test]"

      # Test CLI help works
      - run: python main.py --help

      # Test dry-run on sample project (no LLM calls needed for CLI help)
      - run: |
          python main.py --help 2>&1 | head -20