apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-agent
  namespace: argocd
  labels:
    app: devops-agent
    version: "1.0.0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-agent
  source:
    repoURL: https://github.com/OWNER/REPO.git
    targetRevision: HEAD
    path: k8s/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
