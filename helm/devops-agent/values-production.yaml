replicaCount: 3

image:
  tag: "1.0.0"

service:
  type: ClusterIP

ingress:
  enabled: true
  hosts:
    - host: devops-agent.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  ENVIRONMENT: "production"
  LOG_JSON: "true"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  CORS_ALLOWED_ORIGINS: "https://devops-agent.example.com"

postgres:
  enabled: false  # use external managed DB in prod

redis:
  enabled: false  # use external managed Redis in prod
