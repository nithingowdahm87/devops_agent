apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-agent.fullname" . }}-secrets
  labels:
    {{- include "devops-agent.labels" . | nindent 4 }}
    app: devops-agent
    version: {{ .Chart.AppVersion | quote }}
type: Opaque
data:
  databaseUrl: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  githubToken: {{ .Values.secrets.githubToken | b64enc | quote }}
