apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-agent.fullname" . }}-config
  labels:
    {{- include "devops-agent.labels" . | nindent 4 }}
    app: devops-agent
    version: {{ .Chart.AppVersion | quote }}
data:
  APP_VERSION: {{ .Values.appConfig.appVersion | quote }}
  ENVIRONMENT: {{ .Values.appConfig.environment | quote }}
  SERVER_HOST: {{ .Values.appConfig.serverHost | quote }}
  SERVER_PORT: {{ .Values.appConfig.serverPort | quote }}
  LOG_JSON: {{ .Values.appConfig.logJson | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.appConfig.corsAllowedOrigins | quote }}
