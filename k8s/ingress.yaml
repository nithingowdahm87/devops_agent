apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-agent
  namespace: devops-agent
  labels:
    app: devops-agent
    version: "1.0.0"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: devops-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-agent
                port:
                  number: 80
